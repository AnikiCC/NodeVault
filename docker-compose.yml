services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8080:8080"
    volumes:
      - nodevault_data:/app/data
    environment:
      - NODEVAULT_STORAGE_DIR=/app/data
      - NODEVAULT_MAX_FILE_SIZE=524288000

  frontend:
    build:
      context: ./frontend/fresh-project
      dockerfile: Dockerfile.frontend
    ports:
      - "8000:8000"
    environment:
      - VITE_NODEVAULT_API_URL=http://backend:8080
    depends_on:
      - backend

volumes:
  nodevault_data: